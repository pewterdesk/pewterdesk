[package]
name = "pewterdesk"
version = "0.0.0"
description = "Non-custodial, multi-venue crypto derivatives trading terminal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "pewterdesk"
path = "src/main.rs"
