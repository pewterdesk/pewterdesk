[package]
name = "pewterdesk"
version = "0.0.0"
description = "Non-custodial, multi-venue crypto derivatives trading terminal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

# keyring's backends are pulled per-target so a macOS build never compiles
# dbus, and a Linux build never compiles the Apple bindings.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# crypto-rust encrypts the D-Bus session transport; without it the secret
# crosses the bus in the clear on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[[bin]]
name = "PewterDesk"
path = "src/main.rs"
